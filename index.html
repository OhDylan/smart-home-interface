<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0F12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Home">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0E0F12;
      --text: #F2F0EA;
      --accent: #FFB547;
      --card: #17181D;
      --track-off: #2A2C33;
      --muted: rgba(242, 240, 234, 0.5);
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100dvh;
      padding: calc(48px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 32px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .device {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
      min-height: 104px;
      padding: 24px;
      border: 0;
      border-radius: 28px;
      background: var(--card);
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      transition: transform 150ms var(--ease);
    }

    .device:active { transform: scale(0.98); }

    .device:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .name {
      display: block;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .state {
      display: block;
      margin-top: 6px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--muted);
      transition: color 250ms var(--ease);
    }

    .device[aria-checked="true"] .state { color: var(--accent); }

    .track {
      position: relative;
      flex-shrink: 0;
      width: 84px;
      height: 48px;
      border-radius: 999px;
      background: var(--track-off);
      transition: background-color 300ms var(--ease);
    }

    .thumb {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--text);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      transition: transform 300ms var(--ease);
    }

    .device[aria-checked="true"] .track { background: var(--accent); }
    .device[aria-checked="true"] .thumb { transform: translateX(36px); }

    @media (prefers-reduced-motion: reduce) {
      .device, .state, .track, .thumb { transition: none; }
    }
  </style>
</head>
<body>
  <h1>Home</h1>

  <main class="list">
    <button class="device" role="switch" aria-checked="false">
      <span>
        <span class="name">Living Room Light</span>
        <span class="state">OFF</span>
      </span>
      <span class="track" aria-hidden="true"><span class="thumb"></span></span>
    </button>

    <button class="device" role="switch" aria-checked="false">
      <span>
        <span class="name">Fan</span>
        <span class="state">OFF</span>
      </span>
      <span class="track" aria-hidden="true"><span class="thumb"></span></span>
    </button>

    <button class="device" role="switch" aria-checked="false">
      <span>
        <span class="name">Bedroom Light</span>
        <span class="state">OFF</span>
      </span>
      <span class="track" aria-hidden="true"><span class="thumb"></span></span>
    </button>
  </main>

  <script>
    document.querySelectorAll('.device').forEach(function (el) {
      el.addEventListener('click', function () {
        var on = el.getAttribute('aria-checked') !== 'true';
        el.setAttribute('aria-checked', String(on));
        el.querySelector('.state').textContent = on ? 'ON' : 'OFF';
      });
    });
  </script>
</body>
</html>
